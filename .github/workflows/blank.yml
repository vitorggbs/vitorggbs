name: Generate Psyduck Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: vitorggbs

          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23FACC15&color_dots=%23EBEDF0,%23BFDBFE,%2360A5FA,%233B82F6,%231E3A8A

            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FDE047&color_dots=%230D1117,%231E3A8A,%233B82F6,%2360A5FA,%23FACC15

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
